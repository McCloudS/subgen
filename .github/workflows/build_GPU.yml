name: Build Docker images

on:
  push:
    branches: ["main", "dev", "refactor/drop-stable-ts"]
    paths:
      - 'subgen.py'
      - 'language_code.py'
      - 'launcher.py'
      - 'requirements.txt'
      - 'requirements.whispercpp.txt'
      - 'entrypoint.sh'
      - 'Dockerfile'
      - 'Dockerfile.cpu'
      - 'Dockerfile.AMD'
      - 'Dockerfile.whispercpp'
      - '.github/workflows/build_GPU.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── GPU ────────────────────────────────────────────────────────────────────
  # main:  faster-whisper + CUDA  →  mccloud/subgen:latest
  # dev:   whisper.cpp CUDA       →  mccloud/subgen:dev
  gpu:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
          echo "version=$version" >> $GITHUB_ENV

      - name: Compute tags and build config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            printf 'docker_tags=mccloud/subgen:latest\nmccloud/subgen:%s' "$version" >> $GITHUB_ENV
            echo "dockerfile=./Dockerfile" >> $GITHUB_ENV
            echo "build_args=" >> $GITHUB_ENV
          else
            echo "docker_tags=mccloud/subgen:dev" >> $GITHUB_ENV
            echo "dockerfile=./Dockerfile.whispercpp" >> $GITHUB_ENV
            echo "build_args=BASE_IMAGE=ghcr.io/ggerganov/whisper.cpp:main-cuda" >> $GITHUB_ENV
          fi

      - uses: docker/setup-buildx-action@v3
        with:
          name: subgen-gpu-builder
          keep-state: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.dockerfile }}
          build-args: ${{ env.build_args }}
          push: true
          tags: ${{ env.docker_tags }}
          cache-from: type=registry,ref=mccloud/subgen:buildcache
          cache-to: type=registry,ref=mccloud/subgen:buildcache,mode=max

  # ── CPU (multi-arch) ───────────────────────────────────────────────────────
  # main:  faster-whisper CPU     →  mccloud/subgen:cpu
  # dev:   whisper.cpp CPU        →  mccloud/subgen:dev-cpu
  cpu:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
          echo "version=$version" >> $GITHUB_ENV

      - name: Compute tags and build config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            printf 'docker_tags=mccloud/subgen:cpu\nmccloud/subgen:%s-cpu' "$version" >> $GITHUB_ENV
            echo "dockerfile=./Dockerfile.cpu" >> $GITHUB_ENV
            echo "build_args=" >> $GITHUB_ENV
          else
            echo "docker_tags=mccloud/subgen:dev-cpu" >> $GITHUB_ENV
            echo "dockerfile=./Dockerfile.whispercpp" >> $GITHUB_ENV
            echo "build_args=BASE_IMAGE=ghcr.io/ggerganov/whisper.cpp:main" >> $GITHUB_ENV
          fi

      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0
      - uses: docker/setup-buildx-action@v3
        with:
          name: subgen-cpu-builder
          keep-state: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.dockerfile }}
          build-args: ${{ env.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.docker_tags }}
          cache-from: type=registry,ref=mccloud/subgen:cpu-buildcache
          cache-to: type=registry,ref=mccloud/subgen:cpu-buildcache,mode=max

  # ── AMD (ROCm) ─────────────────────────────────────────────────────────────
  # main:  faster-whisper ROCm    →  mccloud/subgen:amd
  # dev:   whisper.cpp HIP        →  mccloud/subgen:dev-amd
  # NOTE: On main, AMD builds after GPU+CPU to avoid large-upload contention.
  amd:
    runs-on: [self-hosted]
    needs: ${{ github.ref_name == 'main' && fromJSON('["gpu","cpu"]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
          echo "version=$version" >> $GITHUB_ENV

      - name: Compute tags and build config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            printf 'docker_tags=mccloud/subgen:amd\nmccloud/subgen:%s-amd' "$version" >> $GITHUB_ENV
            echo "dockerfile=./Dockerfile.AMD" >> $GITHUB_ENV
            echo "build_args=" >> $GITHUB_ENV
          else
            echo "docker_tags=mccloud/subgen:dev-amd" >> $GITHUB_ENV
            echo "dockerfile=./Dockerfile.whispercpp" >> $GITHUB_ENV
            echo "build_args=BASE_IMAGE=ghcr.io/ggerganov/whisper.cpp:main-hip" >> $GITHUB_ENV
          fi

      - uses: docker/setup-buildx-action@v3
        with:
          name: subgen-amd-builder
          keep-state: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.dockerfile }}
          build-args: ${{ env.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.docker_tags }}
          cache-from: type=registry,ref=mccloud/subgen:amd-buildcache
          cache-to: type=registry,ref=mccloud/subgen:amd-buildcache,mode=max

  # ── whisper.cpp (Vulkan) ───────────────────────────────────────────────────
  # main:  mccloud/subgen:whispercpp
  # dev:   mccloud/subgen:dev-whispercpp
  whispercpp:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
          echo "version=$version" >> $GITHUB_ENV

      - name: Compute tags
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            printf 'docker_tags=mccloud/subgen:whispercpp\nmccloud/subgen:%s-whispercpp' "$version" >> $GITHUB_ENV
          else
            echo "docker_tags=mccloud/subgen:dev-whispercpp" >> $GITHUB_ENV
          fi

      - uses: docker/setup-buildx-action@v3
        with:
          name: subgen-whispercpp-builder
          keep-state: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.whispercpp
          build-args: BASE_IMAGE=ghcr.io/ggerganov/whisper.cpp:main-vulkan
          platforms: linux/amd64
          push: true
          tags: ${{ env.docker_tags }}
          cache-from: type=registry,ref=mccloud/subgen:whispercpp-buildcache
          cache-to: type=registry,ref=mccloud/subgen:whispercpp-buildcache,mode=max
