name: Build Docker images

# Every image is whisper.cpp (faster-whisper and stable-ts images ended with the
# stable-ts code, preserved on the legacy-stable-ts branch, which builds nothing).
# Tags are named by GPU backend (what the user's hardware needs), the same on
# main and dev with a dev- prefix: cuda, vulkan, cpu (and jetson in build_JETSON.yml).
#
#   main                                           dev
#   :latest :cuda :<ver> :<ver>-cuda               :dev :dev-cuda          NVIDIA, CUDA 12.8 (Pascal → Blackwell), amd64
#   :vulkan :<ver>-vulkan :amd :<ver>-amd          :dev-vulkan             Intel/AMD/any Vulkan GPU, amd64 + arm64
#                                                  (:dev-whispercpp, :dev-amd: deprecated aliases)
#   :cpu :<ver>-cpu                                :dev-cpu                no GPU, amd64 + arm64
#
# :amd is an alias of the Vulkan image: the faster-whisper ROCm image ended with stable-ts.
#
# Everything runs on GitHub-hosted runners (free for public repos). arm64 builds
# natively on ubuntu-24.04-arm (no QEMU); each architecture is pushed as
# <tag>-amd64 / <tag>-arm64 and merged into one multi-arch tag.
# To build the CUDA image on a self-hosted runner instead, change its runs-on.

on:
  push:
    branches: ["main", "dev"]
    paths:
      - 'subgen.py'
      - 'language_code.py'
      - 'launcher.py'
      - 'requirements.whispercpp.txt'
      - 'entrypoint.sh'
      - 'Dockerfile.whispercpp'
      - '.github/workflows/build_GPU.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # On main, a push that changes subgen.py is built by "Bump version" after it commits the new
  # version (it starts this workflow with workflow_dispatch), so images carry the bumped version.
  # Without this, builds started from the merge commit and the version tags trailed by one.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ] && [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/compare/${BEFORE}...${GITHUB_SHA}" --jq '.files[].filename' | grep -qx 'subgen.py'; then
              run=false
              echo "subgen.py changed on main: Bump version starts this build after bumping the version."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # ── CUDA (amd64) ───────────────────────────────────────────────────────────
  cuda:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel image plus the build need more than the runner's free disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Tags
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
          if [ "${{ github.ref_name }}" = "main" ]; then
            { echo "tags<<EOF"; printf 'mccloud/subgen:latest\nmccloud/subgen:cuda\nmccloud/subgen:%s\nmccloud/subgen:%s-cuda\n' "$version" "$version"; echo "EOF"; } >> $GITHUB_ENV
          else
            { echo "tags<<EOF"; printf 'mccloud/subgen:dev\nmccloud/subgen:dev-cuda\n'; echo "EOF"; } >> $GITHUB_ENV
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # CUDA 12.x, not 13: CUDA 13 (upstream's main-cuda) drops Pascal/Volta.
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.whispercpp
          build-args: |
            GGML_BACKEND=cuda
            SUBGEN_BRANCH=${{ github.ref_name }}
            BUILD_BASE=nvidia/cuda:12.8.1-devel-ubuntu24.04
            RUNTIME_BASE=nvidia/cuda:12.8.1-runtime-ubuntu24.04
          platforms: linux/amd64
          push: true
          tags: ${{ env.tags }}
          cache-from: type=registry,ref=mccloud/subgen:buildcache-cuda${{ github.ref_name != 'main' && '-dev' || '' }}
          cache-to: type=registry,ref=mccloud/subgen:buildcache-cuda${{ github.ref_name != 'main' && '-dev' || '' }},mode=max

  # ── CPU and Vulkan, one native runner per architecture ─────────────────────
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tag
        run: |
          # Shell, not a GitHub expression: in expressions an empty string is falsy, so the
          # "main and empty, else dev-" idiom returned dev- on main as well.
          if [ "${{ github.ref_name }}" = "main" ]; then prefix=""; else prefix="dev-"; fi
          echo "tag=mccloud/subgen:${prefix}${{ matrix.backend }}-${{ matrix.arch }}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.whispercpp
          build-args: |
            GGML_BACKEND=${{ matrix.backend }}
            SUBGEN_BRANCH=${{ github.ref_name }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.tag }}
          cache-from: type=registry,ref=mccloud/subgen:buildcache-${{ matrix.backend }}-${{ matrix.arch }}
          cache-to: type=registry,ref=mccloud/subgen:buildcache-${{ matrix.backend }}-${{ matrix.arch }},mode=max

  merge:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
          b=${{ matrix.backend }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            src="mccloud/subgen:$b"
            tags="mccloud/subgen:$b mccloud/subgen:${version}-$b"
            [ "$b" = vulkan ] && tags="$tags mccloud/subgen:amd mccloud/subgen:${version}-amd"
          else
            src="mccloud/subgen:dev-$b"
            tags="mccloud/subgen:dev-$b"
            [ "$b" = vulkan ] && tags="$tags mccloud/subgen:dev-whispercpp mccloud/subgen:dev-amd"
          fi
          echo "src=$src" >> $GITHUB_ENV
          echo "tags=$tags" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge into multi-arch manifest
        run: |
          args=""
          for t in $tags; do args="$args -t $t"; done
          docker buildx imagetools create $args ${src}-amd64 ${src}-arm64
          docker buildx imagetools inspect ${src}
