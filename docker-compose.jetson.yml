# docker-compose for NVIDIA Jetson (Orin / Thor, aarch64) with CUDA (whisper.cpp).
#
# Prereqs on the host:
#   * JetPack 6+ (L4T r36+).
#   * nvidia-container-toolkit installed and configured (docker
#     default-runtime nvidia, or `runtime: nvidia` below).
#
# Start:  docker compose -f docker-compose.jetson.yml up -d
# Check the log for "whisper.cpp is using GPU device: ...". See docs/JETSON.md.

services:
   subgen:
      container_name: subgen
      tty: true
      image: mccloud/subgen:jetson
      # Jetson + nvidia-container-toolkit: mounts the host's GPU driver into the container.
      # (If your daemon's default runtime is already "nvidia" this is a no-op.)
      runtime: nvidia
      environment:
         - "NVIDIA_VISIBLE_DEVICES=all"
         # Jetson specifics: /dev/nvmap is 0440 root:video on headless L4T,
         # so CUDA needs root inside the container. PUID=0 makes
         # entrypoint.sh skip the unprivileged user switch.
         - "PUID=0"
         - "PGID=0"
         - "WHISPER_MODEL=large-v3-turbo-q5_0"
         - "PROCADDEDMEDIA=True"
         - "PROCMEDIAONPLAY=False"
         - "NAMESUBLANG=aa"
         - "SKIPIFINTERNALSUBLANG=eng"
         - "PLEXTOKEN=plextoken"
         - "PLEXSERVER=http://plexserver:32400"
         - "JELLYFINTOKEN=token here"
         - "JELLYFINSERVER=http://jellyfin:8096"
         - "WEBHOOKPORT=9000"
         # Jetson memory is shared with the CPU, and each concurrent job loads its own model copy.
         - "CONCURRENT_TRANSCRIPTIONS=1"
         - "DEBUG=True"
         - "USE_PATH_MAPPING=False"
         - "PATH_MAPPING_FROM=/tv"
         - "PATH_MAPPING_TO=/Volumes/TV"
         - "CLEAR_VRAM_ON_COMPLETE=True"
         - "MODEL_PATH=/subgen/models"
         - "UPDATE=False"
         - "APPEND=False"
         - "LRC_FOR_AUDIO_FILES=True"
      volumes:
         - "${TV}:/tv"
         - "${MOVIES}:/movies"
         - "${APPDATA}/subgen/models:/subgen/models"
      ports:
         - "9000:9000"
