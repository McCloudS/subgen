services:
   subgen:
      container_name: subgen
      tty: true
      # Pick the tag for your hardware: latest (or cuda) for NVIDIA, vulkan for Intel/AMD GPUs, cpu for no GPU.
      image: mccloud/subgen:latest
      environment:
         - "WHISPER_MODEL=large-v3-turbo-q5_0"
         - "PROCADDEDMEDIA=True"
         - "PROCMEDIAONPLAY=False"
         - "NAMESUBLANG=aa"
         - "SKIPIFINTERNALSUBLANG=eng"
         - "PLEXTOKEN=plextoken"
         - "PLEXSERVER=http://plexserver:32400"
         - "JELLYFINTOKEN=token here"
         - "JELLYFINSERVER=http://jellyfin:8096"
         - "WEBHOOKPORT=9000"
         # Each concurrent job loads its own copy of the model (about 1 GB for large-v3-turbo-q5_0).
         - "CONCURRENT_TRANSCRIPTIONS=2"
         - "DEBUG=True"
         - "USE_PATH_MAPPING=False"
         - "PATH_MAPPING_FROM=/tv"
         - "PATH_MAPPING_TO=/Volumes/TV"
         - "CLEAR_VRAM_ON_COMPLETE=True"
         - "MODEL_PATH=/subgen/models"
         - "UPDATE=False"
         - "APPEND=False"
         - "USE_MODEL_PROMPT=False"
         - "CUSTOM_MODEL_PROMPT="
         - "LRC_FOR_AUDIO_FILES=True"
      volumes:
         - "${TV}:/tv"
         - "${MOVIES}:/movies"
         - "${APPDATA}/subgen/models:/subgen/models"
      ports:
         - "9000:9000"
      # # ⚠️ NVIDIA GPU (image mccloud/subgen:latest or :cuda) ⚠️
      # # uncomment the following lines to pass the NVIDIA GPU to the container
      # deploy:
      #    resources:
      #       reservations:
      #          devices:
      #             - driver: nvidia
      #               count: 1
      #               capabilities:
      #                  - gpu
      #
      #
      # # ⚠️ Intel or AMD GPU, including integrated graphics (image mccloud/subgen:vulkan) ⚠️
      # # uncomment the following lines to pass the GPU to the container
      # devices:
      #    - /dev/dri
      # group_add:
      #    - video
      #    - render
